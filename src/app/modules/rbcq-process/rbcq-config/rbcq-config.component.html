<nz-flex nzVertical="true" nzJustify="center" nzAlign="center" class="form-container" nzWrap="wrap">
    <form [formGroup]="rbcqProcessForm">
        <div class="form-item">
            <div class="label-container">
                <label class="form-label">RBCQ Process Type:</label>
                <nz-select 
                    formControlName="processType"
                    class="select-size"
                    nzPlaceHolder="Enter Process Type"
                    [nzOptions]="rbcqProcessType"
                >
                </nz-select>
            </div>
        </div>

        <div *ngIf="isApFlagSelected()">
            <div class="form-item region-item">
                <label class="form-label">Region:</label>

                <div class="region-checkboxes">
                    <label
                        nz-checkbox
                        *ngFor="let region of rbcqRegions"
                        [nzChecked]="region.value === RbcqRegion.ALL
                            ? rbcqProcessForm.get('regions')?.value.length === 3
                            : rbcqProcessForm.get('regions')?.value.includes(region.value)"
                        (nzCheckedChange)="onRegionChange(region.value, $event)">
                        {{ region.label }}
                    </label>
                </div>
            </div>
        </div>
                
        <nz-space nzWrap="wrap">
            <div class="form-item" *nzSpaceItem>
                <label class="form-label">Trading Date From:</label>
                <nz-date-picker
                    [(ngModel)]="startDatetime"
                    formControlName="startDatetime"
                    class="select-size"
                    nzPlaceHolder="Select start date "
                    [nzShowTime]="{ nzFormat: 'HH:mm', nzMinuteStep: 5 }"
                    nzFormat="yyyy-MM-dd HH:mm"
                ></nz-date-picker>
            </div>
            <div class="form-item" *nzSpaceItem>
                <label class="form-label">Trading Date To:</label>
                <nz-date-picker
                    [(ngModel)]="endDatetime"
                    formControlName="endDatetime"
                    class="select-size"
                    nzPlaceHolder="Select end date "
                    [nzShowTime]="{ nzFormat: 'HH:mm', nzMinuteStep: 5 }"
                    nzFormat="yyyy-MM-dd HH:mm"
                ></nz-date-picker>
            </div>
        </nz-space>

        <div *ngIf="rbcqProcessForm.errors?.['invalidDateRange'] && (rbcqProcessForm.dirty || rbcqProcessForm.touched)" class="error-message">
            Trading Date To must be the same or after Trading Date From
        </div>

        <div *ngIf="rbcqProcessForm.errors?.['invalidMinuteInterval'] && (rbcqProcessForm.dirty || rbcqProcessForm.touched)" class="error-message">
            Time must be in 5-minute intervals (e.g., 00, 05, 10...)
        </div>

        

       <!-- <nz-progress
        *ngIf="isProcessing"
        [nzPercent]="progressValue"
        [nzStatus]="progressValue < 100 ? 'active' : 'success'"
        ></nz-progress>
       -->

    </form>

<!-- <pre>{{ rbcqProcessForm.value | json }}</pre>
<pre>Valid: {{ rbcqProcessForm.valid }}</pre>
<pre>Errors: {{ rbcqProcessForm.errors | json }}</pre> -->

</nz-flex>

<nz-flex nzGap="large" nzAlign="start" nzJustify="end">

  <button
    nz-button
    nzType="primary"
    [nzLoading]="isProcessing"
    [disabled]="rbcqProcessForm.invalid || isProcessing"
    (click)="onSubmitRbcqProcess()">
    Process
  </button>

  <button
    *ngIf="isApFlagSelected()"
    nz-button
    nzType="primary"
    (click)="loadAPFlag()">
    View Flagged RBCQ
  </button>

</nz-flex>


<div *ngIf="isApFlagSelected()">
  <nz-table [nzData]="rows" nzBordered [nzLoading]="loading" [nzShowPagination]="false" class="zebra-table" [nzScroll]="{ y: '400px' }">
    <thead>
      <tr>
        <th>Dispatch Interval</th>
        <th>Region</th>
        <th>Flag</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td>{{ row.dispatchInterval | date:'yyyy-MM-dd HH:mm' }}</td>
        <td>{{ row.region }}</td>
        <td>{{ row.flag }}</td>
      </tr>
    </tbody>
  </nz-table>

  <!-- Pagination and Page Size Options -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <div class="d-flex align-items-center gap-3">
      <span>Show</span>
      <nz-select [(ngModel)]="pageSize" (ngModelChange)="onPageSizeChange($event)" style="width: 80px">
        <nz-option *ngFor="let size of pageSizeOptions" [nzValue]="size" [nzLabel]="size + ' rows'"></nz-option>
      </nz-select>
      <span>Total: {{ totalItems }} records</span>
    </div>

 <nz-pagination
    [nzPageIndex]="currentPage"
    [nzPageSize]="pageSize"
    [nzTotal]="totalItems"
    (nzPageIndexChange)="onPageChange($event)">
  </nz-pagination>


  </div>
</div>
