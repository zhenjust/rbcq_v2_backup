<nz-spin [nzSpinning]="busy$ && !busy$.closed">
  @if (paramForm.invalid && paramForm.touched) {
  <nz-alert nzBanner nzType="error" [nzMessage]="MESSAGE.REQUIRED_FIELDS" class="mb-3"></nz-alert>
  }

  <form nz-form [formGroup]="paramForm" nzLayout="vertical" nzNoColon>
    <nz-form-item>
      <nz-form-label nzRequired>{{ LABELS.FUEL_TYPE }}</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="fuelType" nzMode="multiple" nzShowArrow [nzOptions]="fuelTypeOptions" [nzPlaceHolder]="LABELS.CHOOSE_HERE"
          [nzAllowClear]="true" nzShowSearch></nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label nzRequired>{{ LABELS.EFFECTIVE_DATE }}</nz-form-label>
      <nz-form-control>
        <nz-range-picker formControlName="effectiveDate" class="w-100"></nz-range-picker>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item class="mb-0">
      <nz-form-label nzRequired>{{ LABELS.STATUS }}</nz-form-label>
      <nz-form-control>
        <nz-select formControlName="active" [nzOptions]="statusOptions" [nzPlaceHolder]="LABELS.CHOOSE_HERE"
          [nzAllowClear]="true" nzShowSearch></nz-select>
      </nz-form-control>
    </nz-form-item>
  </form>

</nz-spin>


<div class="d-flex justify-content-end" *nzModalFooter>
  <nz-space>
    <button *nzSpaceItem nz-button (click)="triggerClose()">{{ LABELS.CLOSE }}</button>
    <button *nzSpaceItem nz-button nzType="primary" (click)="save()">{{ LABELS.SAVE }}</button>
  </nz-space>
</div>
