<nz-card [nzTitle]="LABELS.WESM_PENALTY">
  <!-- Filters -->
  @if (showForm) {
    <form nz-form [formGroup]="form" nzLayout="horizontal" class="column">
      <div class="row">
        <div class="col-sm-12 col-md-4 col-lg-4">
          <nz-form-item class="mb-3">
            <nz-form-label nzSpan="8">{{ LABELS.BILLING_PERIOD }}</nz-form-label>
            <nz-form-control nzSpan="16">
              <nz-select formControlName="billingPeriod" [nzOptions]="billingPeriodOpts" [nzPlaceHolder]="LABELS.ALL"
              [nzAllowClear]="true" nzShowSearch></nz-select>
            </nz-form-control>
          </nz-form-item>

            <nz-form-item>
              <nz-form-label nzSpan="8">{{ LABELS.STATUS }}</nz-form-label>
              <nz-form-control nzSpan="16">
                <nz-select formControlName="status" [nzOptions]="statusOptions" [nzPlaceHolder]="LABELS.ALL" [nzAllowClear]="true" nzShowSearch></nz-select>
              </nz-form-control>
            </nz-form-item>

            <nz-form-item class="mb-3">
              <nz-form-label nzSpan="8">{{ LABELS.TYPE }}</nz-form-label>
              <nz-form-control nzSpan="16">
                <nz-select formControlName="type" [nzOptions]="typeOptions" [nzPlaceHolder]="LABELS.ALL" [nzAllowClear]="true" nzShowSearch></nz-select>
              </nz-form-control>
            </nz-form-item>
        </div>
      </div>
    </form>
  }

  <div class="d-flex justify-content-between mb-3">
    <nz-space>
      @if (showForm) {
        <button nz-button *nzSpaceItem [disabled]="form.invalid" (click)="resetFilters()">
          {{ LABELS.CLEAR_FILTERS }}
        </button>
      }

      <button nz-button *nzSpaceItem nzType="primary" [disabled]="form.invalid" (click)="showForm ? paginatedTable?.search() : showForm =! showForm">
        {{ showForm ? LABELS.APPLY_FILTERS : LABELS.SET_FILTERS }}
      </button>
    </nz-space>

    <nz-space>
      <button *nzSpaceItem nz-button>
        {{ LABELS.GENERATE_PENALTY_IWS }}
      </button>

      <button *nzSpaceItem nz-button>
        {{ LABELS.GENERATE_REFUND_IWS }}
      </button>

      <button *nzSpaceItem nz-button nzType="primary" nz-dropdown [nzDropdownMenu]="menu">
        {{ LABELS.MORE_ACTIONS }} <nz-icon nzType="down" />
      </button>

      <nz-dropdown-menu #menu="nzDropdownMenu">
        <ul nz-menu nzSelectable>
          <li nz-menu-item>{{ LABELS.CALCULATE }}</li>
          <li nz-menu-item>{{ LABELS.FINALIZE }}</li>
          <li nz-menu-item>{{ LABELS.PUBLISH }}</li>
          <li nz-menu-item>{{ LABELS.GENERATE_FILES }}</li>
        </ul>
      </nz-dropdown-menu>
    </nz-space>
  </div>

  <!-- Table -->
  <app-paginated-table #paginatedTable [enableCheckbox]="true" [tableColumns]="tableColumns" [url]="getUrl()" [showActions]="true" [tableConfig]="{ height: '60vh' }" [enableExpand]="true" [expandTpl]="expandTpl"></app-paginated-table>

  <ng-template #expandTpl let-row="row">
    <div class="d-flex w-100 my-2 pe-2">
      <app-template-table class="w-100" [tableColumns]="expandedTableCols" [tableData]="row?.pipelineRuns" ></app-template-table>

      <!-- [actionsTpl]="expandTplActions" -->
      <!-- <ng-template #expandTplActions let-subRowData="row">
        @if (subRowData.fileName) {
          <a nz-button nzType="link" nzSize="small" (click)="download(subRowData)" nzBlock>{{ LABELS.DOWNLOAD }}</a>
        }
      </ng-template> -->
    </div>
  </ng-template>
</nz-card>
