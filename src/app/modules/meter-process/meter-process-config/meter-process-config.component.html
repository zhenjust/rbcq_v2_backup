<nz-flex nzVertical="true" nzJustify="center" nzAlign="center" class="form-container">
    <form [formGroup]="meterProcessForm">
        <div class="form-item">
            <div class="label-container">
                <label class="form-label">Meter Process Type:</label>
                <nz-select 
                    formControlName="processType"
                    class="select-size"
                    nzPlaceHolder="Enter Process Type"
                    [nzOptions]="meterProcessTypeOptions"
                >
                </nz-select>
            </div>
        </div>
        
        <div class="form-item" *ngIf="isAdjustmentType">
            <div class="label-container">
                <label class="form-label">Adjustment Number</label>
                <nz-input-number 
                    formControlName="adjNo" 
                    class="select-size"
                    nzPlaceHolder="Enter adjustment number"
                >
                </nz-input-number>
            </div>
        </div>
        
        <div class="form-item" *ngIf="isDailyType">
            <div class="label-container">
                <label class="form-label">Trading Date:</label>
                <nz-date-picker
                    formControlName="tradingDate"
                    class="select-size"
                    nzPlaceHolder="Select trading date"
                ></nz-date-picker>
            </div>
        </div>
        
        <div *ngIf="isNotDailyType">
            <div class="form-item">
                <div class="label-container">
                    <label class="form-label">Billing Period:</label>
                    <nz-select
                        formControlName="billingPeriod"
                        class="select-size"
                        nzPlaceHolder="Select Billing Period"
                    >
                        <!-- TODO: Replace with actual billing period options -->
                        <nz-option nzValue="240121" nzLabel="January 2024"></nz-option>
                        <nz-option nzValue="240222" nzLabel="February 2024"></nz-option>
                        <nz-option nzValue="240321" nzLabel="March 2024"></nz-option>
                        <!-- Add more options as needed -->
                    </nz-select>
                </div>
            </div>
            
            <nz-space>
                <div class="form-item" *nzSpaceItem>
                    <label class="form-label">Start Date:</label>
                    <nz-date-picker
                        formControlName="startDate"
                        class="select-size"
                        nzPlaceHolder="Select start date"
                    ></nz-date-picker>
                </div>
                <div class="form-item" *nzSpaceItem>
                    <label class="form-label">End Date:</label>
                    <nz-date-picker
                        formControlName="endDate"
                        class="select-size"
                        nzPlaceHolder="Select end date"
                    ></nz-date-picker>
                </div>
            </nz-space>
        </div>
        
        <div class="form-item">
            <div class="label-container">
                <label class="form-label">Region Group:</label>
                <nz-select
                    formControlName="regionGroup"
                    class="select-size"
                    nzPlaceHolder="Select region group"
                    [nzOptions]="meterProcessRegionGroup"
                >
                </nz-select>
            </div>
        </div>
    </form>
</nz-flex>
