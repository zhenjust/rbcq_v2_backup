<nz-table 
    #nzTable 
    [nzData]="tableData.content" 
    [nzLoading]="isLoading" 
    [nzPageSize]="tableData.totalElements"
    [nzPageIndex]="tableData.totalPages"
    [nzFrontPagination]="false"
>
    <thead>
        <tr>
            <th nzWidth="60px"></th>
            @for (column of columnItem; track column) {
                <th>{{column.name}}</th>
            }
        </tr>
    </thead>
    <tbody>
        <ng-container *ngFor="let data of nzTable.data; trackBy: trackByBillingPeriod">
            <tr>
                <td [nzExpand]="expandSet.has(data.billingPeriod)" (nzExpandChange)="onExpandChange(data.billingPeriod, $event)"></td>
                <td>{{ data.processType }}</td>
                <td>{{ data.date }}</td>
                <td></td>
            </tr>
            <tr [nzExpand]="expandSet.has(data.billingPeriod)">
                <div class="centered-inner-table">
                    <nz-table #nzTable [nzLoading]="isLoading">
                        <thead>
                            <tr>
                                <th></th>
                                @for (column of childColumnItem; track column) {
                                    <th>{{column.name}}</th>
                                }
                                <th></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Inner table data rows would go here -->
                        </tbody>
                    </nz-table>
                </div>
            </tr>
        </ng-container>
    </tbody>
</nz-table>
