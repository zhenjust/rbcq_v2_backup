<nz-card nzTitle="RBCQ">
  <div class="d-flex justify-content-center align-items-center mb-3">
    <div class="d-flex align-items-center gap-3">
      <div class="d-flex flex-column align-items-center">
        <label class="mb-1">START DATE</label>
        <nz-date-picker [(ngModel)]="startDate" nzShowTime [nzShowTime]="{ nzFormat: 'HH:mm', nzMinuteStep: 5 }" [nzFormat]="'yyyy-MM-dd HH:mm'"></nz-date-picker>
      </div>

      <div class="d-flex flex-column align-items-center">
        <label class="mb-1">END DATE</label>
        <nz-date-picker [(ngModel)]="endDate" nzShowTime [nzShowTime]="{ nzFormat: 'HH:mm', nzMinuteStep: 5 }" [nzFormat]="'yyyy-MM-dd HH:mm'"></nz-date-picker>
      </div>

      <div class="d-flex flex-column align-items-center">
        <label class="mb-1" style="visibility:hidden">actions</label>
        <div class="d-flex gap-2">
          <button nz-button nzType="primary" (click)="load()" [disabled]="loading">SEARCH</button>
          <button nz-button (click)="clear()" [disabled]="loading">CLEAR</button>
        </div>
      </div>
    </div>
    <div *ngIf="loading" class="ml-3"><nz-spin nzSimple></nz-spin></div>
  </div>

  <nz-table [nzData]="rows" nzBordered [nzLoading]="loading">
    <thead>
      <tr>
        <th>Dispatch Interval</th>
        <th>Region</th>
        <th>MTN</th>
        <th>Category</th>
        <th style="text-align:right">BCQ</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <td>{{ row.dispatch_interval | date:'yyyy-MM-dd HH:mm' }}</td>
        <td>{{ row.region }}</td>
        <td>{{ row.mtn }}</td>
        <td>{{ row.category }}</td>
        <td style="text-align:right">{{ row.bcq }}</td>
      </tr>
    </tbody>
  </nz-table>

</nz-card>
