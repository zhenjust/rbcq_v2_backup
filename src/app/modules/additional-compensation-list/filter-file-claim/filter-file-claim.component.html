<nz-flex [nzJustify]="'flex-end'" class="button-container" nzGap="large">
    <button nz-button nzType="primary">Filter</button>
        @if (isFileClaimPage()) {<button
            nz-button
            nzType="primary"
            (click)="fileClaimModal()"
        >
            File a Claim</button
        >}
</nz-flex>

<ng-template #fileClaim let-modal>
    <nz-flex nzVertical="true" class="form-container">
        <form [formGroup]="fileClaimForm">
            <div class="form-item">
                <div class="label-container">
                    <label class="form-label">Billing Period:</label>
                    <nz-select
                        formControlName="billingPeriod"
                        nzPlaceHolder="Select Billing Period"
                        style="width: 400px;"
                    >
                        @for (billing of meterProcessBillingPeriod(); track billing.id) {
                            <nz-option
                                [nzValue]="billing.id"
                                [nzLabel]="billing.supplyMonth"
                            ></nz-option>
                        }
                    </nz-select>
                </div>
            </div>
            <nz-space nzWrap="wrap">
                <div class="form-item">
                    <label class="form-label">Start Date:</label>
                    <nz-date-picker
                        formControlName="startDate"
                        nzFormat="yyyy-MM-dd HH:mm"
                        [nzDisabled]="true"
                        nzPlaceHolder="Start Date"
                    >
                    </nz-date-picker>
                </div>
                <div class="form-item">
                    <label class="form-label">End Date:</label>
                    <nz-date-picker
                        formControlName="endDate"
                        nzFormat="yyyy-MM-dd HH:mm"
                        [nzDisabled]="true"
                        nzPlaceHolder="End Date"
                    >
                    </nz-date-picker>
                </div>
            </nz-space>
            <nz-flex nzJustify="end" style="margin-bottom: 12px">
                <button
                    nz-button
                    nzType="primary"
                    [disabled]="!hasBillingPeriod()"
                    (click)="addDateRange()"
                >
                    Add Date Range
                </button>
            </nz-flex>
            <nz-table
                #nzTable
                [nzData]="billingPeriodDateRange()"
                [nzSize]="'small'"
            >
                <thead>
                    <tr>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                    <tbody>
                        @for (billingDate of nzTable.data; track $index; let i = $index) {
                            <tr>
                                <td>
                                    <nz-date-picker
                                        [ngModel]="billingDate.startDate"
                                        (ngModelChange)="updateDateRange(i, 'startDate', $event)"
                                        nzFormat="yyyy-MM-dd HH:mm"
                                        [nzShowTime]="{ nzFormat: 'HH:mm', nzHourStep: 1, nzMinuteStep: 5 }"
                                        nzPlaceHolder="Start Date & Time"
                                    ></nz-date-picker>
                                </td>
                                <td>
                                    <nz-date-picker
                                        [ngModel]="billingDate.endDate"
                                        (ngModelChange)="updateDateRange(i, 'endDate', $event)"
                                        nzFormat="yyyy-MM-dd HH:mm"
                                        [nzShowTime]="{ nzFormat: 'HH:mm', nzHourStep: 1, nzMinuteStep: 5 }"
                                        nzPlaceHolder="End Date & Time"
                                    ></nz-date-picker>
                                </td>
                                <td>
                                    <button
                                        nz-button
                                        nzType="default"
                                        nzDanger
                                        type="button"
                                        (click)="deleteDateRange(i)"
                                    >
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        }
                    </tbody>
            </nz-table>
            <hr />
            <div class="form-item">
                <div class="label-container">
                    <label class="form-label">Pricing Conditions:</label>
                    <nz-select
                        formControlName="pricingCondition"
                        nzPlaceHolder="Select Pricing Condition"
                        style="width: 400px;"
                    >
                        @for (pc of pricingConditions; track pc) {
                            <nz-option
                                [nzValue]="pc.id"
                                [nzLabel]="pc.label"
                            >
                            </nz-option>
                        }
                    </nz-select>
                </div>
            </div>
            <nz-flex nzJustify="end" style="margin-bottom: 12px">
                <button
                    nz-button
                    nzType="primary"
                    [disabled]="hasClaimant()"
                    (click)="addClaimant()"
                >
                    Add a Claimant
                </button>
            </nz-flex>
            <nz-table
                #nzTable
                [nzSize]="'small'"
            >
                <thead>
                    <tr>
                        <th>Billing ID</th>
                        <th>MTN</th>
                        <th>Approved Rate</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </nz-table>
        </form>
    </nz-flex>
</ng-template>
