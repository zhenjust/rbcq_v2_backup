<div class="navbar-container">
    <div class="menu-container">
      <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed && !isHovered">
        <ng-container *ngFor="let item of navItems">
          <ng-container *ngIf="!item.children || item.children.length === 0; else subMenu">
            <li nz-menu-item (click)="navigateTo(item)" *ngIf="hasPermission(item)" class="linkHover">
              <a class="nav-link">
                <fa-icon *ngIf="item.icon" [icon]="item.icon" class="nav-icon" size="lg"></fa-icon>
                <span class="nav-text" *ngIf="shouldShowText()">{{ item.title }}</span>
              </a>
            </li>
          </ng-container>
          
          <ng-template #subMenu>
            <li nz-submenu [nzTitle]="parentMenuTitle" [nzOpen]="isDropdownOpen(item)" (nzOpenChange)="toggleDropdown(item, $event)" class="subChildColor linkHover">
              <ng-template #parentMenuTitle>
                <fa-icon *ngIf="item.icon" [icon]="item.icon" class="nav-icon" size="lg"></fa-icon>
                <span class="nav-text" *ngIf="shouldShowText()">{{ item.title }}</span>
              </ng-template>
              <ul>
                <ng-container *ngFor="let child of item.children">
                  <ng-container *ngIf="!child.children || child.children.length === 0; else childMenu">
                    <li nz-menu-item (click)="navigateTo(child)" *ngIf="hasPermission(child)" class="subChildColor linkHover">
                      <span>{{ child.title }}</span>
                    </li>
                  </ng-container>
                  
                  <ng-template #childMenu>
                    <li nz-submenu [nzTitle]="childMenuTitle" [nzOpen]="isDropdownOpen(child)" (nzOpenChange)="toggleDropdown(child, $event)">
                      <ng-template #childMenuTitle>
                        <span class="nav-text" *ngIf="shouldShowText()" class="subChildColor linkHover">{{ child.title }}</span>
                      </ng-template>
                      <ul>
                        <ng-container *ngFor="let child2 of child.children">
                          <li nz-menu-item (click)="navigateTo(child2)" *ngIf="hasPermission(child2)" class="subChildColor linkHover">
                            <span>{{ child2.title }}</span>
                          </li>
                        </ng-container>
                      </ul>
                    </li>
                  </ng-template>
                </ng-container>
              </ul>
            </li>
          </ng-template>
        </ng-container>
      </ul>
    </div>
  
    <div class="logo-container">
      <img src="assets/images/iemop_logo_1.png" class="logo-image" alt="Logo" />
    </div>
</div>
