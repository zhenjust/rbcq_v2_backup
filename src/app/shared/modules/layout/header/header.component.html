<div class="d-flex justify-content-between">
    <nz-space nzSize="large">
        <img src="assets/images/svg/crss_logo_topbar.svg" alt="logo" />
        <ng-container *ngFor="let link of headerLinks">
            <a nz-button nzType="text" [href]="link.url">{{ link.label }}</a>
        </ng-container>
    </nz-space>
    <div class="d-flex align-items-center">
        <app-bell class="px-4"></app-bell>
        <button
            nz-button
            nz-popover
            nzType="text"
            nzSize="large"
            nzPopoverTrigger="click"
            [nzPopoverContent]="contentTemplate"
            [nzPopoverVisible]="visible"
            nzPopoverPlacement="bottomRight"
            >
            <nz-space>
                <span *ngIf="userData">
                    {{userData.principal?.userName}}
                </span>
                <fa-icon [icon]="ellipsisIcon"></fa-icon>
            </nz-space>
        </button
        >
    </div>
</div>

<ng-template #contentTemplate>
    <nz-space nzDirection="vertical">
        <button nz-button nzType="text" nzBlock nzSize="large">Profile</button>
        <button nz-button nzType="text" nzBlock nzSize="large">Change Password</button>

        <!-- TODO update this if statement  -->
        <button 
            *ngIf="userData" 
            nz-button 
            nzType="text" 
            nzBlock 
            nzSize="large">{{ userOptions }}</button>
        <button nz-button nzType="text" nzBlock (click)="logoutUser()">Logout</button>        
    </nz-space>
</ng-template>
