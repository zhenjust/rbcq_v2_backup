image: node:lts-alpine

stages:
  - prepare
  - build
  - package
  - deploy

compute_version:
  stage: prepare
  script:
    - echo "APP_VERSION=$(npm pkg get version | tr -d '\"')" > build.env
  rules:
    - if: $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "web" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /RC[0-9]+$/)
    - if: $CI_PIPELINE_SOURCE == "web"
  artifacts:
    reports:
      dotenv: build.env

build:
  stage: build
  cache:
    paths:
      - node_modules/
  script:
    - npm i && npm run build
  artifacts:
    paths:
      - dist/*
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE != "web" || $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"

package:
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - echo "{\"auths\":{\"$IEMOP_REGISTRY\":{\"username\":\"$IEMOP_REGISTRY_USERNAME\",\"password\":\"$IEMOP_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context $CI_PROJECT_DIR --dockerfile $CI_PROJECT_DIR/Dockerfile --destination exist.azurecr.io/iemop/crss-ui-bsmd2:${APP_VERSION}-b${CI_COMMIT_SHA:0:7}
  rules:
    - if: $CI_DEPLOY_FREEZE == null && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /RC[0-9]+$/)
    - if: $CI_PIPELINE_SOURCE == "web"

deploy:
  stage: deploy
  variables:
    SERVICE_NAME: crss-ui-bsmd2
    APP_HASH: ${CI_COMMIT_SHA}
    APP_VERSION: ${APP_VERSION}
  trigger:
    project: exist-software-labs/iemop/crss/gitops
    branch: main
    strategy: depend
  environment:
    name: dev
    url: https://crss-dev.exist.com.ph
  rules:
    - if: $CI_DEPLOY_FREEZE == null && $CI_PIPELINE_SOURCE != "web" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /RC[0-9]+$/)
    - if: $CI_DEPLOY_FREEZE && $CI_PIPELINE_SOURCE != "web" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /RC[0-9]+$/)
      when: manual
      allow_failure: true
    - if: $CI_PIPELINE_SOURCE == "web"
